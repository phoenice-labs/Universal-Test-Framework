# =============================================================================
# Universal Test Framework — Core Test Contract
# Version: 1.0.0
# This is the CANONICAL definition of the 8-section test contract.
# Every generated test MUST satisfy ALL sections. The contract_validator
# module enforces this before any output is returned to the caller.
# =============================================================================

contract:
  version: "1.0.0"
  name: "Universal 8-Section Test Contract"
  description: >
    Every test generated by this framework must include all 8 sections.
    No test may be returned to the caller if any section is absent, empty,
    or contains only a placeholder value. Validation score must be >= 0.85.

  minimum_score: 0.85        # 0.0–1.0; output blocked if score < this
  require_all_sections: true # hard-block if any section missing

  sections:
    - id: 1
      key: test_id
      name: "Test ID"
      required: true
      description: >
        Unique identifier for the test case. Format: TC-{REQ|US|AC|BUG|PERF|SEC}-{NNN}
        Examples: TC-REQ-001, TC-US-042, TC-SEC-007
      validation:
        pattern: "^TC-[A-Z]{2,8}-\\d{3,6}$"
        min_length: 8
        max_length: 30
      score_weight: 0.10

    - id: 2
      key: why_generated
      name: "Why This Test Was Generated"
      required: true
      description: >
        Clear rationale explaining WHY this test exists. Must reference a
        requirement, acceptance criterion, business rule, or known risk.
        Must NOT be generic (e.g., "to test the function" is rejected).
      validation:
        min_length: 50
        must_not_match:
          - "^to test"
          - "^testing"
          - "^ensures it works"
      score_weight: 0.10

    - id: 3
      key: requirement_mapping
      name: "Requirement / Behavior Mapped"
      required: true
      description: >
        Explicit links to requirements: User Story ID, Acceptance Criteria ID,
        Jira ticket number, or inline requirement description. At least one
        concrete reference is required.
      validation:
        min_length: 20
        must_include_one_of:
          - "US-"
          - "AC-"
          - "REQ-"
          - "JIRA-"
          - "BUG-"
          - "NFR-"
          - "requirement:"
          - "story:"
          - "acceptance criteria"
      score_weight: 0.15

    - id: 4
      key: how_it_exercises
      name: "How the Test Exercises the System"
      required: true
      description: >
        Step-by-step description of: inputs used, mocks/stubs set up,
        execution flow through the system, and what assertions are made.
        Must cover: GIVEN / WHEN / THEN or equivalent.
      validation:
        min_length: 100
        recommended_keywords:
          - ["given", "arrange", "setup", "precondition"]
          - ["when", "act", "execute", "invoke", "call"]
          - ["then", "assert", "verify", "expect", "check"]
      score_weight: 0.20

    - id: 5
      key: coverage_contribution
      name: "Coverage Contribution"
      required: true
      description: >
        Specifies what coverage this test adds: coverage type (branch, line,
        statement, path, mutation), which module/class/function it covers,
        and estimated percentage contribution to total module coverage.
      validation:
        min_length: 30
        must_include_one_of:
          - "branch"
          - "line"
          - "statement"
          - "path"
          - "mutation"
          - "equivalence"
          - "boundary"
      score_weight: 0.15

    - id: 6
      key: expected_outcome
      name: "Expected Outcome"
      required: true
      description: >
        Precise assertions and success/failure criteria. Must include:
        return values or response codes expected, state changes expected,
        side effects expected or verified absent.
      validation:
        min_length: 50
        recommended_keywords:
          - ["returns", "raises", "throws", "status", "response", "output"]
          - ["assert", "expect", "should", "must", "verify"]
      score_weight: 0.15

    - id: 7
      key: gaps_missing
      name: "What's Missing / Gaps"
      required: true
      description: >
        Honest assessment of what this test does NOT cover: uncovered edge
        cases, scenarios that would require additional tests, known risks
        not addressed. Must not be empty or "none".
      validation:
        min_length: 40
        must_not_match:
          - "^none$"
          - "^n/a$"
          - "^nothing$"
          - "^no gaps$"
      score_weight: 0.10

    - id: 8
      key: meaningfulness_check
      name: "Meaningfulness Check"
      required: true
      description: >
        Self-assessment of test quality: Is this test meaningful? Is it
        redundant with another test? Could it be a hallucinated test that
        doesn't map to real behavior? Must explicitly state "meaningful" or
        "potentially redundant" with justification.
      validation:
        min_length: 50
        must_include_one_of:
          - "meaningful"
          - "redundant"
          - "hallucination"
          - "no hallucination"
          - "directly validates"
      score_weight: 0.05

  # Additional optional sections (do not block output if missing)
  optional_sections:
    - key: test_data
      name: "Test Data"
      description: "Realistic test data used, including preconditions and cleanup"

    - key: automation_code
      name: "Automation Code"
      description: "Executable test code in the target framework"

    - key: otel_annotations
      name: "OpenTelemetry / Observability"
      description: "Trace IDs, span annotations, structured log hooks"

    - key: metadata
      name: "Metadata"
      description: "Author, created date, last modified, review status"

# Suite-level requirements (apply to the entire test suite, not individual tests)
suite_requirements:
  traceability_matrix: true     # Suite must include a traceability matrix
  coverage_assessment: true     # Suite must include overall coverage assessment
  gap_recommendations: true     # Suite must list recommended additional tests
  minimum_tests_per_requirement: 1
  require_negative_tests: true  # At least one negative/failure scenario per feature
  require_boundary_tests: true  # At least one boundary/edge case per numeric input

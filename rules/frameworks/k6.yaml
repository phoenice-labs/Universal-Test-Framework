# k6 performance testing framework rules
framework: k6
language: javascript
version: ">=0.50"

setup:
  install: "https://k6.io/docs/get-started/installation/"
  run: "k6 run script.js"
  cloud: "k6 cloud script.js"

test_structure:
  basic: |
    import http from 'k6/http';
    import { check, sleep } from 'k6';

    export const options = {
      vus: 10,
      duration: '30s',
      thresholds: {
        http_req_duration: ['p(95)<500'],
        http_req_failed: ['rate<0.01'],
      },
    };

    export default function () {
      const res = http.get('https://test.example.com/api/endpoint');
      check(res, {
        'status is 200': (r) => r.status === 200,
        'response time < 500ms': (r) => r.timings.duration < 500,
      });
      sleep(1);
    }

scenarios:
  smoke: "1 VU, short duration — validates basic functionality"
  average_load: "simulate normal traffic"
  stress: "ramp up to find breaking point"
  spike: "sudden large increase in traffic"
  soak: "extended duration to find memory leaks"

metrics:
  builtin:
    - "http_req_duration (p50, p95, p99)"
    - "http_req_failed (rate)"
    - "http_reqs (count)"
    - "vus (gauge)"
    - "iterations (count)"
    - "data_received / data_sent (bytes)"
  custom: "new Trend('custom_metric')"

thresholds:
  response_time: "http_req_duration: ['p(95)<500', 'p(99)<1000']"
  error_rate: "http_req_failed: ['rate<0.01']"
  throughput: "http_reqs: ['rate>100']"

checks: "check(response, { 'key': (r) => condition })"

output:
  formats: ["json", "csv", "influxdb", "prometheus", "cloud"]
  summary: "k6 run --summary-export=summary.json"

contract_comment_template: |
  /**
   * Test ID: {test_id}
   * Why Generated: {why_generated}
   * Requirement Mapping: {requirement_mapping} (NFR-xxx)
   * How it Exercises:
   *   GIVEN: {given} (VUs, scenario, target endpoint)
   *   WHEN: {when} (load pattern applied)
   *   THEN: {then} (metrics checked)
   * Coverage: Performance coverage — SLA validation for {endpoint}
   * Expected Outcome: p95 < {p95_ms}ms, error rate < {error_rate}%
   * Gaps: {gaps_missing}
   * Meaningfulness: {meaningfulness_check}
   */

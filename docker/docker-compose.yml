# Universal Test Framework — Docker Compose
# Starts the MCP server for team/remote use via HTTP/SSE transport.

version: "3.9"

services:
  utf-server:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: universal-test-framework:1.0.0
    container_name: utf-mcp-server
    restart: unless-stopped

    ports:
      - "8765:8765"

    environment:
      # Override transport settings via environment
      UTF_HOST: "0.0.0.0"
      UTF_PORT: "8765"
      UTF_LOG_LEVEL: "info"

    # Read-only filesystem for security
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777

    # Non-root user (matches Dockerfile USER utf, UID 1000)
    user: "1000:1000"

    # Resource limits
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M

    # Security options
    security_opt:
      - no-new-privileges:true

    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8765/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Optional: Nginx reverse proxy for HTTPS termination
  # Uncomment for production HTTPS deployment
  # nginx:
